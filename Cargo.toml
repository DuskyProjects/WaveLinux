[workspace]
members = [
    "crates/accelerator",
    "crates/dsp",
    "crates/model",
    "crates/pw",
    "crates/engine",
    "crates/app",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/DuskyProjects/WaveLinux"
authors = ["WaveLinux contributors"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
include_dir = "0.7"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[patch.crates-io]
nnnoiseless = { path = "vendor/nnnoiseless" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
