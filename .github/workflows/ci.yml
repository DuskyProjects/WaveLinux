name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test -p wavelinux-accelerator --all-features --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p wavelinux-accelerator --all-features --all-targets --locked -- -D warnings

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn web:build
      - run: node node_modules/.bin/playwright install --with-deps chromium
      - run: yarn test:e2e

  scripts-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pipewire-bin pipewire-pulse ripgrep shellcheck
      - run: shellcheck scripts/*.sh
      - run: bash scripts/check-docs.sh
      - run: bash scripts/check-dependencies.sh
      - run: git diff --check
