name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test -p wavelinux-accelerator --all-features --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p wavelinux-accelerator --all-features --all-targets --locked -- -D warnings

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn web:build
      - run: node node_modules/.bin/playwright install --with-deps chromium
      - run: yarn test:e2e

  scripts-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pipewire-bin pipewire-pulse ripgrep shellcheck
      - run: shellcheck scripts/*.sh
      - run: bash scripts/check-docs.sh
      - run: bash scripts/check-dependencies.sh
      - run: git diff --check

  emergency-appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bubblewrap \
            desktop-file-utils \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libayatana-appindicator3-dev \
            libcap2 \
            libclang-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libspa-0.2-dev \
            libusb-1.0-0 \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm \
            squashfs-tools \
            xdg-dbus-proxy \
            xdg-utils
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - name: Verify signed bundled profile catalog
        shell: bash
        run: cargo test --workspace --locked
      - name: Build helper binaries and AppImage
        shell: bash
        env:
          NO_STRIP: "1"
        run: |
          cargo build --release -p wavelinux-dsp --bin wavelinux6-audio-core
          cargo build --release -p wavelinux-app --bin wavelinux6-peripheral-plugin
          bash scripts/stage-appimage-runtime.sh
          cd crates/app
          ../../node_modules/.bin/tauri build --bundles appimage
          cd ../..
          APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/finalize-appimage.sh
      - name: Stage AppImage artifact
        shell: bash
        run: |
          mkdir -p emergency-appimage
          cp target/release/bundle/appimage/*.AppImage emergency-appimage/
          cd emergency-appimage
          sha256sum *.AppImage > SHA256SUMS
          printf 'Source commit: 49ca141cfb56024c26cb57f59d7dd5f292046e6c\nBuild commit: %s\nCatalog: bundled index verified with committed Ed25519 signature.\n' "$GITHUB_SHA" > BUILD-INFO.txt
          ls -lh
      - uses: actions/upload-artifact@v7
        with:
          name: wavelinux6-signed-appimage
          path: emergency-appimage
          if-no-files-found: error
          retention-days: 7
