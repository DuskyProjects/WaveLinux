name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        default: v6.0.1
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-bundles:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install Linux build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bubblewrap \
            desktop-file-utils \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libayatana-appindicator3-dev \
            libcap2 \
            libclang-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libspa-0.2-dev \
            libusb-1.0-0 \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm \
            ripgrep \
            shellcheck \
            squashfs-tools \
            xdg-dbus-proxy \
            xdg-utils

      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile

      - name: Install browser test runtime
        run: node node_modules/.bin/playwright install --with-deps chromium

      - name: Verify release version and identity
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -e 'console.log(require("./package.json").version)')"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ "$release_tag" != "v$version" ]]; then
            echo "Tag $release_tag does not match package version $version" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            release_name="WaveLinux $version"
            prerelease="true"
            make_latest="false"
          else
            release_name="WaveLinux $version"
            prerelease="false"
            make_latest="true"
          fi

          {
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

      - name: Run source release gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p wavelinux-accelerator --all-features --all-targets -- -D warnings
          cargo test --workspace --locked
          cargo test -p wavelinux-accelerator --all-features --all-targets --locked
          yarn test
          yarn web:build
          yarn test:e2e
          shellcheck install.sh scripts/*.sh
          bash scripts/check-docs.sh
          bash scripts/test-installers.sh

      - name: Build AppImage, Debian, RPM, and updater bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WAVELINUX_RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          WAVELINUX_UPDATE_VERSION: ${{ steps.version.outputs.version }}
          NO_STRIP: "0"
        run: yarn desktop:release

      - name: Require every Linux release format
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          debs=(target/release/bundle/deb/*.deb)
          rpms=(target/release/bundle/rpm/*.rpm)
          updater_archives=(target/release/bundle/appimage/*.AppImage.tar.gz)
          updater_signatures=(target/release/bundle/appimage/*.AppImage.tar.gz.sig)

          (( ${#appimages[@]} > 0 )) || {
            echo "Release build did not produce an AppImage." >&2
            exit 1
          }
          (( ${#debs[@]} > 0 )) || {
            echo "Release build did not produce a Debian package." >&2
            exit 1
          }
          (( ${#rpms[@]} > 0 )) || {
            echo "Release build did not produce an RPM package." >&2
            exit 1
          }
          (( ${#updater_archives[@]} > 0 )) || {
            echo "Release build did not produce the AppImage updater archive." >&2
            exit 1
          }
          (( ${#updater_signatures[@]} > 0 )) || {
            echo "Release build did not produce the AppImage updater signature." >&2
            exit 1
          }

          printf 'AppImage: %s\n' "${appimages[@]}"
          printf 'Debian: %s\n' "${debs[@]}"
          printf 'RPM: %s\n' "${rpms[@]}"

      - name: Verify package identity and required executables
        run: bash scripts/check-package-contents.sh target/release/bundle

      - name: Build updater manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          artifact="$(find target/release/bundle/appimage -name '*.AppImage.tar.gz' | sort | head -n 1)"
          python3 scripts/build-updater-manifest.py \
            --artifact "$artifact" \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --output target/release/bundle/latest.json \
            --notes "$RELEASE_NAME"

      - name: Stage AUR package metadata
        run: bash scripts/build-aur.sh

      - name: Build and verify the standalone installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p target/release/gate/assets
          appimage="target/release/bundle/appimage/WaveLinux6_${VERSION}_amd64.AppImage"
          test -s "$appimage"
          WAVELINUX_INSTALLER_OUTPUT_DIR=target/release/gate/assets \
          WAVELINUX_INSTALLER_APPIMAGE="$appimage" \
          WAVELINUX_INSTALLER_AUDIO_CORE=target/release/wavelinux6-audio-core \
          WAVELINUX_INSTALLER_PERIPHERAL_PLUGIN=target/release/wavelinux6-peripheral-plugin \
            bash scripts/build-standalone-installer.sh
          bash scripts/check-standalone-installer.sh \
            "target/release/gate/assets/WaveLinux6_${VERSION}_amd64_Installer.sh"
          bash scripts/check-standalone-installer.sh \
            target/release/gate/assets/WaveLinux6_amd64_Installer.sh
          cmp \
            "target/release/gate/assets/WaveLinux6_${VERSION}_amd64_Installer.sh" \
            target/release/gate/assets/WaveLinux6_amd64_Installer.sh

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          cp target/release/bundle/appimage/*.AppImage* target/release/gate/assets/
          cp target/release/bundle/deb/*.deb* target/release/gate/assets/
          cp target/release/bundle/rpm/*.rpm* target/release/gate/assets/
          cp target/release/bundle/latest.json target/release/gate/assets/
          cp install.sh target/release/gate/assets/install.sh
          cp target/aur/wavelinux/PKGBUILD target/release/gate/assets/
          cp target/aur/wavelinux/.SRCINFO target/release/gate/assets/wavelinux.SRCINFO
          printf 'Release: %s\nVersion: %s\nTag: %s\nCommit: %s\n' \
            "$RELEASE_NAME" "$VERSION" "$RELEASE_TAG" "$(git rev-parse HEAD)" \
            > target/release/gate/assets/BUILD-INFO.txt
          python3 scripts/build-release-manifest.py \
            --assets target/release/gate/assets \
            --output target/release/gate/assets/BUILD-MANIFEST.json \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)"
          checksum_file=target/release/gate/SHA256SUMS.tmp
          (
            cd target/release/gate/assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$checksum_file"
          mv "$checksum_file" target/release/gate/assets/SHA256SUMS
          (
            cd target/release/gate/assets
            sha256sum --check --strict SHA256SUMS
          )
          awk -v version="$VERSION" '
            $0 == "# WaveLinux " version { in_section = 1; found = 1 }
            in_section && /^# WaveLinux / && $0 != "# WaveLinux " version { exit }
            in_section { print }
            END { if (!found) exit 1 }
          ' RELEASE_NOTES.md > target/release/gate/release-notes.md
          find target/release/gate -maxdepth 2 -type f -printf '%p\n' | sort

      - name: Upload gated release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wavelinux-linux-bundles-${{ steps.version.outputs.version }}
          path: target/release/gate
          if-no-files-found: error

  portability:
    needs: linux-bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian13
            target: appimage
          - distro: ubuntu2404
            target: appimage
          - distro: fedora
            target: appimage
          - distro: arch
            target: appimage
          - distro: cachyos
            target: appimage
          - distro: opensuse
            target: appimage
          - distro: debian13
            target: standalone
          - distro: ubuntu2404
            target: standalone
          - distro: fedora
            target: standalone
          - distro: arch
            target: standalone
          - distro: cachyos
            target: standalone
          - distro: opensuse
            target: standalone
          - distro: debian13
            target: native
          - distro: ubuntu2404
            target: native
          - distro: fedora
            target: native
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.linux-bundles.outputs.release_tag }}
      - uses: actions/download-artifact@v8
        with:
          name: wavelinux-linux-bundles-${{ needs.linux-bundles.outputs.version }}
          path: target/release/gate
      - name: Test ${{ matrix.target }} on fresh ${{ matrix.distro }}
        env:
          WAVELINUX_SMOKE_ARTIFACT_VERSION: ${{ needs.linux-bundles.outputs.version }}
          WAVELINUX_SMOKE_LOCAL_ASSET_DIR: ${{ github.workspace }}/target/release/gate/assets
        run: |
          bash scripts/distro-smoke.sh \
            --distro "${{ matrix.distro }}" \
            --target "${{ matrix.target }}" \
            --release-tag "${{ needs.linux-bundles.outputs.release_tag }}"

  publish:
    needs: [linux-bundles, portability]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wavelinux-linux-bundles-${{ needs.linux-bundles.outputs.version }}
          path: target/release/gate

      - name: Verify publish payload
        shell: bash
        run: |
          test -n "$(find target/release/gate/assets -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find target/release/gate/assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find target/release/gate/assets -maxdepth 1 -name '*.rpm' -print -quit)"
          test -s "target/release/gate/assets/WaveLinux6_${{ needs.linux-bundles.outputs.version }}_amd64_Installer.sh"
          test -s target/release/gate/assets/WaveLinux6_amd64_Installer.sh
          test -s target/release/gate/assets/install.sh
          test -s target/release/gate/assets/BUILD-MANIFEST.json
          test -s target/release/gate/assets/SHA256SUMS
          (cd target/release/gate/assets && sha256sum --check --strict SHA256SUMS)
          find target/release/gate/assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish packages into GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.linux-bundles.outputs.release_tag }}
          name: ${{ needs.linux-bundles.outputs.release_name }}
          body_path: target/release/gate/release-notes.md
          prerelease: ${{ needs.linux-bundles.outputs.prerelease }}
          make_latest: ${{ needs.linux-bundles.outputs.make_latest }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            target/release/gate/assets/*.AppImage
            target/release/gate/assets/*.AppImage.tar.gz
            target/release/gate/assets/*.AppImage.tar.gz.sig
            target/release/gate/assets/*.deb
            target/release/gate/assets/*.rpm
            target/release/gate/assets/*.sh
            target/release/gate/assets/latest.json
            target/release/gate/assets/SHA256SUMS
            target/release/gate/assets/BUILD-INFO.txt
            target/release/gate/assets/BUILD-MANIFEST.json
            target/release/gate/assets/PKGBUILD
            target/release/gate/assets/wavelinux.SRCINFO

      - name: Mark malformed 6.0 prerelease as superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit 6.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "WaveLinux 6.0 (superseded)" \
              --notes "This empty prerelease used an invalid tag and is not installable. Use v6.0.0 or the latest stable release." \
              --prerelease
          fi
