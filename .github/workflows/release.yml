name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-bundles:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install Linux build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bubblewrap \
            desktop-file-utils \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libayatana-appindicator3-dev \
            libcap2 \
            libclang-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libspa-0.2-dev \
            libusb-1.0-0 \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm \
            ripgrep \
            shellcheck \
            squashfs-tools \
            xdg-dbus-proxy \
            xdg-utils

      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile

      - name: Install browser test runtime
        run: node node_modules/.bin/playwright install --with-deps chromium

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="$(node -e 'console.log(require("./package.json").version)')"
          if [[ "$version" == *-* ]]; then
            echo "Stable releases cannot use a prerelease package version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run source release gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          yarn test
          yarn web:build
          yarn test:e2e
          shellcheck scripts/*.sh
          bash scripts/check-docs.sh

      - name: Build deb, rpm, AppImage, and updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "0"
        run: yarn desktop:release

      - name: Verify package identity and required executables
        run: bash scripts/check-package-contents.sh target/release/bundle

      - name: Build updater manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="$(find target/release/bundle/appimage -name '*.AppImage.tar.gz' | sort | head -n 1)"
          if [[ -z "$artifact" ]]; then
            artifact="$(find target/release/bundle/appimage -name '*.AppImage' | sort | head -n 1)"
          fi
          python3 scripts/build-updater-manifest.py \
            --artifact "$artifact" \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "v$VERSION" \
            --output target/release/bundle/latest.json \
            --notes "WaveLinux $VERSION"

      - name: Stage AUR package metadata
        run: bash scripts/build-aur.sh

      - name: Prepare release gate files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p target/release/gate/assets
          cp target/release/bundle/appimage/*.AppImage* target/release/gate/assets/
          cp target/release/bundle/deb/*.deb* target/release/gate/assets/
          cp target/release/bundle/rpm/*.rpm* target/release/gate/assets/
          cp target/release/bundle/latest.json target/release/gate/assets/
          cp target/aur/wavelinux/PKGBUILD target/release/gate/assets/
          cp target/aur/wavelinux/.SRCINFO target/release/gate/assets/wavelinux.SRCINFO
          awk -v version="$VERSION" '
            $0 == "# WaveLinux " version { in_section = 1; found = 1 }
            in_section && /^# WaveLinux / && $0 != "# WaveLinux " version { exit }
            in_section { print }
            END { if (!found) exit 1 }
          ' RELEASE_NOTES.md > target/release/gate/release-notes.md

      - name: Upload gated release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wavelinux-linux-bundles
          path: target/release/gate
          if-no-files-found: error

  portability:
    needs: linux-bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian13
            target: appimage
          - distro: ubuntu2404
            target: appimage
          - distro: fedora
            target: appimage
          - distro: arch
            target: appimage
          - distro: debian13
            target: native
          - distro: ubuntu2404
            target: native
          - distro: fedora
            target: native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wavelinux-linux-bundles
          path: target/release/gate
      - name: Test ${{ matrix.target }} on fresh ${{ matrix.distro }}
        env:
          WAVELINUX_SMOKE_ARTIFACT_VERSION: ${{ needs.linux-bundles.outputs.version }}
          WAVELINUX_SMOKE_LOCAL_ASSET_DIR: ${{ github.workspace }}/target/release/gate/assets
        run: |
          bash scripts/distro-smoke.sh \
            --distro "${{ matrix.distro }}" \
            --target "${{ matrix.target }}" \
            --release-tag "v${{ needs.linux-bundles.outputs.version }}"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-bundles, portability]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wavelinux-linux-bundles
          path: target/release/gate
      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: WaveLinux ${{ needs.linux-bundles.outputs.version }}
          body_path: target/release/gate/release-notes.md
          prerelease: false
          make_latest: true
          files: target/release/gate/assets/*
