[package]
name = "wavelinux-dsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "wavelinux6-audio-core"
path = "src/bin/wavelinux6-audio-core.rs"

[dependencies]
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# DeepFilterNet's tract adapter targets 0.21.4; later 0.21 releases changed its API.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-data = "=0.21.4"
tract-linalg = "=0.21.4"
libc = "0.2"
rustfft = "6.4"
nnnoiseless = { version = "0.5.2", default-features = false }
pipewire = { version = "0.9", features = ["v0_3_49"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wavelinux-accelerator = { path = "../accelerator" }
wavelinux-model = { path = "../model" }

[dev-dependencies]
tempfile.workspace = true
